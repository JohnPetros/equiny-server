name: Continuous Deployment to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/cd-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  IMAGE_NAME: equiny-server
  IMAGE_URI: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/equiny-server:${{ github.sha }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}

          secrets: |-
            HOST=host:latest
            DATABASE_URL=database-url:latest
            REDIS_URL=redis-url:latest
            INNGEST_SIGNING_KEY=inngest-signing-key:latest
            JWT_SECRET=jwt-secret:latest
            SUPABASE_URL=supabase-url:latest
            SUPABASE_KEY=supabase-key:latest
            SUPABASE_STORAGE_BUCKET=supabase-storage-bucket:latest
            ONESIGNAL_APP_ID=onesignal-app-id:latest
            ONESIGNAL_API_KEY=onesignal-api-key:latest
            EMAIL_VERIFICATION_SECRET=email-verification-secret:latest
            EQUINY_SERVER_URL=equiny-server-url:latest
            RESEND_API_KEY=resend-api-key:latest
            RESEND_SENDER_EMAIL=resend-sender-email:latest

          secrets_update_strategy: merge

          flags: >-
            --port=8080
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=10
            --concurrency=80
            --timeout=300
            --service-account=${{ secrets.CLOUD_RUN_RUNTIME_SA }}

      - name: Publish deployment summary
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "- Serviço: \`${CLOUD_RUN_SERVICE}\`"
            echo "- Imagem: \`${IMAGE_URI}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
