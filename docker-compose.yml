services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: equiny
      POSTGRES_USER: equiny
      POSTGRES_PASSWORD: equiny
    ports:
      - "5432:5432"
    volumes:
      - equiny_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equiny -d equiny"]
      interval: 5s
      timeout: 5s
      retries: 10

  inngest:
    image: inngest/inngest:v0.27.0
    command: "inngest dev -u http://localhost:8080/api/inngest"
    ports:
      - "8288:8288"
    depends_on:
      - postgres

volumes:
  equiny_postgres_data:
